{% extends 'base.html' %}

{% block content %}
<div class="main-container">
	<header>
		<h1>ASCII Art Generator</h1>
		<p class="subtitle">
			Upload an image and watch it transform into text-based art.
		</p>
	</header>

	<!-- Upload form -->
	<div class="card">
		<form id="upload-form" enctype="multipart/form-data">
			<label for="file-input" class="file-label">Choose an Image</label>
			<input type="file" id="file-input" name="image" accept="image/*" required />
			<p id="file-name"></p>
			<input type="submit" value="Generate" />
		</form>
	</div>

	<!-- Loading Spinner -->
	<div class="loader"></div>

	<!-- Result Card (initially hidden) -->
	<div class="card" id="result-container">
		<div class="result-header">
			<h2>Output ASCII Art</h2>
			<div class="button-group">
				<button id="copy-btn" class="util-btn">Copy</button>
				<button id="download-btn" class="util-btn">Download as .txt</button>
			</div>
		</div>
		<pre id="ascii-art"></pre>
	</div>
</div>
{% endblock %}
